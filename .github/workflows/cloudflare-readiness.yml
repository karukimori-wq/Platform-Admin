name: Cloudflare Migration Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - infra/cloudflare-clerk-migration

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Next.js build
        run: npm run build

      - name: Validate Wrangler config
        run: npm run cf:check

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Verify generated Cloudflare types are type-safe
        run: npm run typecheck

      - name: Apply D1 schema locally
        run: npm run d1:schema:local

      - name: Verify D1 schema locally
        run: npm run d1:verify:local

      - name: Cloudflare deployment dry run
        run: npm run deploy:dry-run
