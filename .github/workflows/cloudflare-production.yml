name: Cloudflare Production
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PLATFORM_ADMIN_API_TOKEN: ${{ secrets.PLATFORM_ADMIN_API_TOKEN }}
  PRODUCTION_URL: https://platform-admin.karukimori.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Require production configuration
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$PLATFORM_ADMIN_API_TOKEN"
      - name: Verify Cloudflare identity
        run: npx wrangler whoami
      - name: Ensure Platform Admin D1 database
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="platform-admin");process.stdout.write(db?.uuid??db?.id??"")')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create platform-admin
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="platform-admin");process.stdout.write(db?.uuid??db?.id??"")')
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p="wrangler.jsonc";const s=fs.readFileSync(p,"utf8").replace("00000000-0000-0000-0000-000000000000",process.env.DB_ID??process.argv[1]);fs.writeFileSync(p,s)' "$DB_ID"
          npx wrangler d1 info platform-admin
      - name: Apply D1 schema
        run: npx wrangler d1 execute platform-admin --remote --file=cloudflare/schema.sql --yes
      - name: Build OpenNext Worker
        run: npm run cf:build
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Configure operator secret
        run: printf '%s' "$PLATFORM_ADMIN_API_TOKEN" | npx wrangler secret put PLATFORM_ADMIN_API_TOKEN
      - name: Verify public production endpoints
        run: |
          sleep 5
          curl --fail --silent --show-error "$PRODUCTION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$PRODUCTION_URL/version" | tee /tmp/version.json
          curl --fail --silent --show-error "$PRODUCTION_URL/contracts/status" | tee /tmp/contracts.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/persistence/status" | tee /tmp/persistence.json
      - name: Verify D1 roundtrip
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/persistence/roundtrip" -H "x-platform-admin-token: $PLATFORM_ADMIN_API_TOKEN" | tee /tmp/roundtrip.json
          node - <<'NODE'
          const fs=require('node:fs');
          const persistence=JSON.parse(fs.readFileSync('/tmp/persistence.json','utf8'));
          const roundtrip=JSON.parse(fs.readFileSync('/tmp/roundtrip.json','utf8'));
          if(persistence.status!=='success'||persistence.data?.driver!=='d1'||persistence.data?.d1Reachable!==true||persistence.data?.databaseBackedPersistenceReady!==true)throw new Error('Platform Admin D1 readiness failed');
          if(roundtrip.status!=='success'||roundtrip.data?.persistenceDriver!=='d1'||roundtrip.data?.roundtripReady!==true)throw new Error('Platform Admin D1 roundtrip failed');
          NODE
