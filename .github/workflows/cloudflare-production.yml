name: Cloudflare Production
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PLATFORM_ADMIN_API_TOKEN: ${{ secrets.PLATFORM_ADMIN_API_TOKEN }}
  PRODUCTION_URL: https://platform-admin.karukimori.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Require production configuration
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$PLATFORM_ADMIN_API_TOKEN"
      - name: Verify Cloudflare identity
        run: npx wrangler whoami
      - name: Ensure Platform Admin D1 database
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="platform-admin");process.stdout.write(db?.uuid??db?.id??"")')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create platform-admin
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="platform-admin");process.stdout.write(db?.uuid??db?.id??"")')
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p="wrangler.jsonc";const s=fs.readFileSync(p,"utf8").replace("00000000-0000-0000-0000-000000000000",process.argv[1]);fs.writeFileSync(p,s)' "$DB_ID"
          npx wrangler d1 info platform-admin
      - name: Apply D1 schema
        run: npx wrangler d1 execute platform-admin --remote --file=cloudflare/schema.sql --yes
      - name: Build OpenNext Worker
        run: npm run cf:build
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Configure operator secret
        run: printf '%s' "$PLATFORM_ADMIN_API_TOKEN" | npx wrangler secret put PLATFORM_ADMIN_API_TOKEN
      - name: Verify public production endpoints
        run: |
          sleep 5
          curl --fail --silent --show-error "$PRODUCTION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$PRODUCTION_URL/version" | tee /tmp/version.json
          curl --fail --silent --show-error "$PRODUCTION_URL/contracts/status" | tee /tmp/contracts.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/persistence/status" | tee /tmp/persistence.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/plan-readiness" -H "x-platform-admin-token: $PLATFORM_ADMIN_API_TOKEN" | tee /tmp/plan-readiness.json
      - name: Verify D1 roundtrip
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/persistence/roundtrip" -H "x-platform-admin-token: $PLATFORM_ADMIN_API_TOKEN" | tee /tmp/roundtrip.json
          node - <<'NODE'
          const fs=require('node:fs');
          const persistence=JSON.parse(fs.readFileSync('/tmp/persistence.json','utf8'));
          const roundtrip=JSON.parse(fs.readFileSync('/tmp/roundtrip.json','utf8'));
          if(persistence.status!=='success'||persistence.data?.driver!=='d1'||persistence.data?.d1Reachable!==true||persistence.data?.databaseBackedPersistenceReady!==true)throw new Error('Platform Admin D1 readiness failed');
          if(roundtrip.status!=='success'||roundtrip.data?.persistenceDriver!=='d1'||roundtrip.data?.roundtripReady!==true)throw new Error('Platform Admin D1 roundtrip failed');
          NODE
      - name: Verify migrated app monitoring
        run: |
          curl --fail --silent --show-error "$PRODUCTION_URL/api/connection-tests" -H "x-platform-admin-token: $PLATFORM_ADMIN_API_TOKEN" | tee /tmp/connections.json
          node - <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/connections.json','utf8'));
          if(!Array.isArray(payload.data))throw new Error('Connection test payload missing data');
          for(const appName of ['platform-admin','ai-platform-core','communication-planner','growth-engine']){
            const app=payload.data.find(item=>item.appName===appName);
            if(!app)throw new Error(`${appName} monitoring result missing`);
            if(app.healthStatus!=='200 OK')throw new Error(`${appName} health monitoring failed: ${app.healthStatus}`);
            if(app.professionalIdRequired!==false)throw new Error(`${appName} identity contract mismatch`);
            if(app.usesLegacyEventNames===true)throw new Error(`${appName} uses legacy event names`);
            if(app.lastError)throw new Error(`${appName} monitoring reported: ${app.lastError}`);
          }
          const growth=payload.data.find(item=>item.appName==='growth-engine');
          if(growth.baseUrl!=='https://growth-engine.karukimori.workers.dev')throw new Error(`Growth Engine canonical URL mismatch: ${growth.baseUrl}`);
          if(growth.persistenceStatus!=='success')throw new Error(`Growth Engine D1 persistence monitoring failed: ${growth.persistenceStatus}`);
          NODE
      - name: Verify monitoring snapshot persistence
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SNAPSHOT_ID="e2e-ai-platform-core-$RUN_ID"
          cat >/tmp/app-snapshot.json <<EOF
          {"id":"$SNAPSHOT_ID","appName":"AI Platform Core","repositoryUrl":"https://github.com/karukimori-wq/ai-platform-core","status":"healthy","contractVersion":"production-e2e","lastSyncAt":"$NOW","healthCheckUrl":"https://ai-platform-core.karukimori.workers.dev/health","healthCheckStatus":"200 OK","createdAt":"$NOW","updatedAt":"$NOW"}
          EOF
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/ingest/app-connection" -H 'content-type: application/json' -H "x-platform-admin-token: $PLATFORM_ADMIN_API_TOKEN" --data-binary @/tmp/app-snapshot.json | tee /tmp/ingest.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/apps" -H "x-platform-admin-token: $PLATFORM_ADMIN_API_TOKEN" | tee /tmp/apps.json
          SNAPSHOT_ID="$SNAPSHOT_ID" node - <<'NODE'
          const fs=require('node:fs');
          const ingest=JSON.parse(fs.readFileSync('/tmp/ingest.json','utf8'));
          const apps=JSON.parse(fs.readFileSync('/tmp/apps.json','utf8'));
          if(ingest.data?.persisted!==true||ingest.data?.driver!=='d1')throw new Error('Monitoring snapshot was not persisted to D1');
          if(!Array.isArray(apps.data)||!apps.data.some(app=>app.id===process.env.SNAPSHOT_ID))throw new Error('Persisted monitoring snapshot could not be read back');
          NODE