name: External Intelligence Results

on:
  workflow_run:
    workflows:
      - Cloudflare Production
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record verified production result in EIS
        env:
          EIS_BASE_URL: https://external-intelligence-system.vercel.app
          WORKSPACE_ID: professional-platform-dev
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fexternal-intelligence-system.vercel.app")"
          EIS_TOKEN="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          if [ -z "$EIS_TOKEN" ]; then
            echo 'External Intelligence: NOT CONNECTED (GitHub OIDC token missing)'
            exit 0
          fi

          EVIDENCE_URI="${{ github.server_url }}/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID"
          FINGERPRINT='{"runtime":"cloudflare-workers","framework":"nextjs-opennext","database":"cloudflare-d1","auth":"x-platform-admin-token","environment":"production","appRole":"platform-observability","nodeVersion":"22"}'
          VERIFICATION='{"productionDeployed":true,"uiReachable":false,"permissionVerified":true,"requiresPersistence":true,"persistenceVerified":true,"requiresIntegration":true,"integrationVerified":true,"humanVerified":false}'
          payload="$(jq -n \
            --arg workspaceId "$WORKSPACE_ID" \
            --arg projectId "Platform-Admin" \
            --arg appId "platform-admin" \
            --arg componentId "admin" \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg commitSha "$SOURCE_COMMIT" \
            --arg evidenceUri "$EVIDENCE_URI" \
            --argjson fingerprint "$FINGERPRINT" \
            --argjson verification "$VERIFICATION" \
            '{workspaceId:$workspaceId,projectId:$projectId,appId:$appId,componentId:$componentId,repository:$repository,commitSha:$commitSha,taskType:"production-deploy",summary:"Platform Admin Production passed deploy, token-protected plan readiness, D1 roundtrip, migrated-app connection monitoring, and monitoring snapshot persistence/readback checks.",outcome:"implementation_result",success:true,source:"github_actions",knowledgeTitle:"Platform Admin production workflow completed",knowledgeStatement:"The current Platform Admin commit passed its configured Production monitoring and persistence checks, including monitored app health/contracts, D1 roundtrip, and monitoring snapshot readback. This does not establish human UI verification.",evidenceUri:$evidenceUri,fingerprint:$fingerprint,verification:$verification}')"

          http_code="$(curl --silent --show-error --output /tmp/eis-response.json --write-out '%{http_code}' \
            --request POST "${EIS_BASE_URL%/}/api/development/results" \
            --header 'content-type: application/json' \
            --header "authorization: Bearer $EIS_TOKEN" \
            --data "$payload" || true)"

          if [[ "$http_code" =~ ^2 ]]; then
            echo 'External Intelligence: RECORDED (github_oidc)'
            cat /tmp/eis-response.json
            exit 0
          fi

          echo "External Intelligence: NOT CONNECTED (github_oidc, HTTP $http_code)" >&2
          if [ -f /tmp/eis-response.json ]; then cat /tmp/eis-response.json >&2; fi
          exit 0
